services:
  postgres:
    image: postgres:16-alpine
    container_name: bittada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bittada
      POSTGRES_PASSWORD: bittada
      POSTGRES_DB: bittada
    ports:
      - "5432:5432"
    volumes:
      - bittada_pgdata:/var/lib/postgresql/data

volumes:
  bittada_pgdata:
